<h1>Мұхтар Әуезов</h1>
<p>
<strong><i>(1897-1961)</i></strong>
</p>
<hr>
<h2>Өмірі</h2>
<p>
1897 жылы<strong>Шыңғыстау></strong>бөктерінде дүниеге келген. Қазақтың ұлы жазушысы, драматург, ғалым.
</p>
<h2>Шығармалары</h2>
<p>
<u>«Абай жолы»</u>— төрт томдық роман-эпопея.<br>
Пьесалары:<i>«Еңлік-Кебек», «Қарагөз»</i>.</p>
<hr>
<p><mark>1959 жылы</mark>«Абай жолы» үшін Лениндік сыйлық алған.</p>
